<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#173b3f" />
  <meta name="description" content="Pet medication tracker and reminder PWA" />
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex" />
  <meta name="googlebot" content="noindex, nofollow, noarchive, nosnippet, noimageindex" />
  <meta name="bingbot" content="noindex, nofollow, noarchive, nosnippet, noimageindex" />
  <meta name="referrer" content="no-referrer" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="PetMed" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="styles.css" />
  <title>PetMed Tracker</title>
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div>
        <p class="eyebrow">Simple medication reminders</p>
        <h1 id="pageTitle">Today</h1>
      </div>
      <button class="install-btn" id="installBtn" type="button" hidden>Install</button>
    </header>

    <main id="app" class="content" aria-live="polite"></main>

    <nav class="bottom-nav" aria-label="Primary navigation">
      <button type="button" data-route="today" class="nav-item active"><span>✓</span><small>Today</small></button>
      <button type="button" data-route="pets" class="nav-item"><span>🐾</span><small>Pets</small></button>
      <button type="button" data-route="medications" class="nav-item"><span>💊</span><small>Medicines</small></button>
      <button type="button" data-route="profile" class="nav-item"><span>☰</span><small>More</small></button>
    </nav>
  </div>

  <dialog id="modal" class="modal">
    <form method="dialog" class="modal-card" id="modalForm">
      <div class="modal-head">
        <div>
          <p class="eyebrow" id="modalEyebrow"></p>
          <h2 id="modalTitle"></h2>
        </div>
        <button class="icon-btn" value="cancel" type="submit" aria-label="Close">×</button>
      </div>
      <div id="modalBody"></div>
    </form>
  </dialog>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="app.js"></script>
</body>
</html>
