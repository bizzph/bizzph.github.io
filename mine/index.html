<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#08111f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Minesweeper">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>Minesweeper</title>
<style>
:root{
  --app-h:100dvh;
  --bg:#08111f;--panel:#111c2d;--panel2:#18263a;--line:rgba(255,255,255,.09);
  --txt:#f8fafc;--muted:#8fa3bd;--green:#34d399;--amber:#fbbf24;--red:#fb7185;
  --cell:34px;--gap:3px;
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--txt)}
body{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-tap-highlight-color:transparent}
button{font:inherit}
.app{
  height:var(--app-h); max-height:var(--app-h); width:min(100%,780px); margin:0 auto;
  display:grid; grid-template-rows:auto auto minmax(0,1fr) auto;
  gap:8px; padding:max(8px,env(safe-area-inset-top)) 8px max(8px,env(safe-area-inset-bottom));
  overflow:hidden;
}
.top{
  min-height:48px; display:grid; grid-template-columns:1fr auto; align-items:center; gap:8px;
}
.brand{min-width:0}
.brand h1{font-size:clamp(1.08rem,4vw,1.45rem);margin:0;letter-spacing:-.03em;line-height:1.1}
.brand p{margin:3px 0 0;color:var(--muted);font-size:.72rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon-btn,.pill,.tool,.zoom-btn{
  border:1px solid var(--line);color:var(--txt);background:var(--panel2);font-weight:800;cursor:pointer;
}
.icon-btn{height:42px;min-width:44px;border-radius:13px;padding:0 12px}
.hud{
  display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;min-height:48px
}
.difficulties{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;min-width:0}
.pill{height:42px;border-radius:12px;padding:0 8px;font-size:.8rem;min-width:0}
.pill small{display:block;font-size:.58rem;line-height:1;color:var(--muted);margin-top:2px;font-weight:700}
.pill.active{background:#0f513d;border-color:#34d399}
.pill.active small{color:#c8f7e5}
.counters{display:flex;gap:5px}
.counter{
  min-width:52px;height:42px;border-radius:12px;background:#0c1625;border:1px solid var(--line);
  display:grid;place-items:center;padding:3px 6px;text-align:center
}
.counter b{font-size:.88rem;line-height:1}
.counter span{font-size:.52rem;color:var(--muted);line-height:1;margin-top:-3px}
.play-area{
  min-height:0; min-width:0; position:relative; overflow:hidden; border:1px solid var(--line);
  border-radius:16px; background:#07101d;
}
.scroller{
  width:100%;height:100%;min-height:0;overflow:auto;overscroll-behavior:contain;
  -webkit-overflow-scrolling:touch;scrollbar-width:none;
  touch-action:pan-x pan-y;
}
.scroller::-webkit-scrollbar{display:none}
.board-wrap{
  min-width:100%;min-height:100%;width:max-content;height:max-content;
  display:grid;place-items:center;padding:12px;
}
.board{
  display:grid;gap:var(--gap);width:max-content;user-select:none;-webkit-user-select:none;
}
.cell{
  width:var(--cell);height:var(--cell);padding:0;border:0;border-radius:7px;
  background:#263a52;color:white;font-weight:900;font-size:calc(var(--cell)*.49);line-height:1;
  display:grid;place-items:center;box-shadow:inset 0 -2px 0 rgba(0,0,0,.18);
  touch-action:pan-x pan-y;
}
.cell.open{background:#dfe7ef;color:#17202b;box-shadow:none}
.cell.flagged{background:#5b4520}
.cell.mine{background:#fecdd3}
.n1{color:#2563eb!important}.n2{color:#15803d!important}.n3{color:#dc2626!important}
.n4{color:#6d28d9!important}.n5{color:#9f1239!important}.n6{color:#0f766e!important}
.n7{color:#111827!important}.n8{color:#475569!important}
.status{
  position:absolute;left:50%;top:8px;transform:translateX(-50%);z-index:3;pointer-events:none;
  background:rgba(8,17,31,.9);backdrop-filter:blur(8px);border:1px solid var(--line);
  padding:6px 10px;border-radius:999px;font-size:.72rem;font-weight:800;opacity:0;transition:.2s;
  max-width:calc(100% - 24px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis
}
.status.show{opacity:1}.status.win{color:#86efac}.status.lose{color:#fda4af}
.zoom{
  position:absolute;right:8px;bottom:8px;z-index:4;display:flex;gap:5px
}
.zoom-btn{
  width:38px;height:38px;border-radius:11px;padding:0;background:rgba(17,28,45,.92);backdrop-filter:blur(8px)
}
.controls{
  display:grid;grid-template-columns:1fr 1fr auto;gap:7px;min-height:58px;
}
.tool{
  height:58px;border-radius:16px;display:flex;justify-content:center;align-items:center;gap:8px;
  font-size:.95rem
}
.tool .e{font-size:1.3rem}
.tool.active.shovel{background:#0e553d;border-color:#34d399}
.tool.active.flag{background:#66460e;border-color:#fbbf24}
.new-bottom{height:58px;width:52px;border-radius:16px;padding:0}
.install{display:none}
.install.show{display:block}
@media (max-height:700px){
  .app{gap:5px;padding-top:max(5px,env(safe-area-inset-top));padding-bottom:max(5px,env(safe-area-inset-bottom))}
  .top{min-height:38px}
  .brand p{display:none}
  .icon-btn{height:36px;min-width:40px;border-radius:11px}
  .hud{min-height:38px}
  .pill,.counter{height:36px;border-radius:10px}
  .pill{font-size:.72rem}
  .pill small{display:none}
  .counter{min-width:45px}
  .controls{min-height:50px;gap:5px}
  .tool,.new-bottom{height:50px;border-radius:13px}
  .tool{font-size:.86rem}
  .tool .e{font-size:1.15rem}
  .new-bottom{width:48px}
  .board-wrap{padding:8px}
}
@media (max-height:560px){
  .brand h1{font-size:1rem}
  .top{min-height:32px}
  .icon-btn{height:32px}
  .hud{min-height:32px}
  .pill,.counter{height:32px}
  .counter span{display:none}
  .controls{min-height:44px}
  .tool,.new-bottom{height:44px;border-radius:11px}
  .tool .label{display:none}
  .tool .e{font-size:1.25rem}
  .new-bottom{width:44px}
  .zoom-btn{width:34px;height:34px}
}
@media (max-width:370px){
  .pill{padding:0 5px}
  .counter{min-width:42px;padding-inline:3px}
}
@media (orientation:landscape) and (max-height:520px){
  .app{
    grid-template-columns:150px minmax(0,1fr) 118px;
    grid-template-rows:auto minmax(0,1fr);
    grid-template-areas:"top game controls" "hud game controls";
  }
  .top{grid-area:top;align-self:start}
  .brand p{display:none}
  .hud{grid-area:hud;display:flex;flex-direction:column;align-items:stretch;align-self:start}
  .difficulties{grid-template-columns:1fr}
  .pill{height:34px}
  .counters{display:grid;grid-template-columns:repeat(3,1fr)}
  .counter{min-width:0}
  .play-area{grid-area:game}
  .controls{grid-area:controls;grid-template-columns:1fr;align-content:center}
  .tool,.new-bottom{width:100%}
}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand"><h1>💣 Minesweeper</h1><p>Shovel to reveal. Flag suspected mines.</p></div>
    <button class="icon-btn install" id="installBtn">Install</button>
  </header>

  <section class="hud">
    <div class="difficulties" aria-label="Difficulty">
      <button class="pill active" data-level="easy">Easy<small>9×9 · 10</small></button>
      <button class="pill" data-level="medium">Medium<small>14×14 · 35</small></button>
      <button class="pill" data-level="hard">Hard<small>16×30 · 100</small></button>
    </div>
    <div class="counters">
      <div class="counter"><b id="mineCount">10</b><span>mines</span></div>
      <div class="counter"><b id="time">0</b><span>sec</span></div>
      <div class="counter"><b id="moves">0</b><span>moves</span></div>
    </div>
  </section>

  <main class="play-area">
    <div class="status" id="status"></div>
    <div class="scroller" id="scroller">
      <div class="board-wrap"><div class="board" id="board"></div></div>
    </div>
    <div class="zoom" aria-label="Board size">
      <button class="zoom-btn" id="zoomOut" title="Smaller board">−</button>
      <button class="zoom-btn" id="fitBtn" title="Fit board width">Fit</button>
      <button class="zoom-btn" id="zoomIn" title="Larger board">+</button>
    </div>
  </main>

  <nav class="controls" aria-label="Game controls">
    <button class="tool shovel active" id="shovel"><span class="e">⛏️</span><span class="label">Shovel</span></button>
    <button class="tool flag" id="flag"><span class="e">🚩</span><span class="label">Flag</span></button>
    <button class="icon-btn new-bottom" id="newGame" title="New game">↻</button>
  </nav>
</div>

<script>
(() => {
  const levels = {
    easy:{rows:9,cols:9,mines:10,cell:34},
    medium:{rows:14,cols:14,mines:35,cell:30},
    hard:{rows:16,cols:30,mines:100,cell:30}
  };

  let level='easy', cfg=levels.easy, mode='shovel', cells=[], started=false, finished=false;
  let flags=0,moves=0,seconds=0,timer=null,deferredPrompt=null,manualCell=null;

  const $=id=>document.getElementById(id);
  const board=$('board'), scroller=$('scroller'), mineCount=$('mineCount'), time=$('time'),
        movesEl=$('moves'), status=$('status'), shovel=$('shovel'), flag=$('flag');

  function syncViewport(){
    const h = window.visualViewport ? window.visualViewport.height : window.innerHeight;
    document.documentElement.style.setProperty('--app-h', `${Math.round(h)}px`);
  }
  syncViewport();
  window.addEventListener('resize',syncViewport,{passive:true});
  if(window.visualViewport){
    visualViewport.addEventListener('resize',syncViewport,{passive:true});
    visualViewport.addEventListener('scroll',syncViewport,{passive:true});
  }

  function setCell(px){
    manualCell=Math.max(22,Math.min(44,Math.round(px)));
    document.documentElement.style.setProperty('--cell',manualCell+'px');
  }
  function autoCell(){
    const w=scroller.clientWidth-24, h=scroller.clientHeight-24;
    if(level==='easy'){
      setCell(Math.min(40,(w-(cfg.cols-1)*3)/cfg.cols,(h-(cfg.rows-1)*3)/cfg.rows));
    } else if(level==='medium'){
      setCell(Math.min(34,Math.max(24,(w-(cfg.cols-1)*3)/cfg.cols)));
    } else {
      setCell(Math.max(28,Math.min(34,h/11)));
    }
  }
  function fitWidth(){
    const w=scroller.clientWidth-20;
    setCell((w-(cfg.cols-1)*3)/cfg.cols);
    requestAnimationFrame(()=>{scroller.scrollLeft=0;scroller.scrollTop=0});
  }

  function setMode(m){
    mode=m;
    shovel.classList.toggle('active',m==='shovel');
    flag.classList.toggle('active',m==='flag');
    shovel.setAttribute('aria-pressed',m==='shovel');
    flag.setAttribute('aria-pressed',m==='flag');
    if(navigator.vibrate) navigator.vibrate(8);
  }

  function empty(){
    cells=Array.from({length:cfg.rows*cfg.cols},(_,i)=>({i,mine:false,open:false,flag:false,count:0}));
  }
  function neighbors(i){
    const r=Math.floor(i/cfg.cols),c=i%cfg.cols,a=[];
    for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++){
      if(!dr&&!dc)continue;
      const rr=r+dr,cc=c+dc;
      if(rr>=0&&rr<cfg.rows&&cc>=0&&cc<cfg.cols)a.push(rr*cfg.cols+cc);
    }
    return a;
  }
  function placeMines(safe){
    const ban=new Set([safe,...neighbors(safe)]);
    const pool=cells.map(x=>x.i).filter(i=>!ban.has(i));
    for(let i=pool.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]]}
    pool.slice(0,cfg.mines).forEach(i=>cells[i].mine=true);
    cells.forEach(c=>{if(!c.mine)c.count=neighbors(c.i).filter(i=>cells[i].mine).length});
  }
  function startTimer(){
    if(timer)return;
    timer=setInterval(()=>{seconds++;time.textContent=seconds},1000);
  }
  function stopTimer(){clearInterval(timer);timer=null}
  function toast(msg,type=''){
    status.textContent=msg; status.className='status show '+type;
    clearTimeout(toast.t); toast.t=setTimeout(()=>status.classList.remove('show'),1600);
  }
  function render(){
    board.style.gridTemplateColumns=`repeat(${cfg.cols},var(--cell))`;
    board.innerHTML='';
    cells.forEach(c=>{
      const b=document.createElement('button');
      b.className='cell'; b.dataset.i=c.i; b.setAttribute('aria-label',`Cell ${c.i+1}`);
      if(c.open){
        b.classList.add('open');
        if(c.mine){b.classList.add('mine');b.textContent='💣'}
        else if(c.count){b.textContent=c.count;b.classList.add('n'+c.count)}
      }else if(c.flag){b.classList.add('flagged');b.textContent='🚩'}
      board.appendChild(b);
    });
  }
  function flood(i){
    const q=[i],seen=new Set;
    while(q.length){
      const n=q.shift(); if(seen.has(n))continue;seen.add(n);
      const c=cells[n]; if(c.flag||c.mine)continue;
      c.open=true;
      if(c.count===0)neighbors(n).forEach(x=>{if(!cells[x].open&&!cells[x].mine)q.push(x)});
    }
  }
  function reveal(i){
    const c=cells[i];if(finished||c.open||c.flag)return;
    if(!started){started=true;placeMines(i);startTimer()}
    moves++;movesEl.textContent=moves;
    if(c.mine){c.open=true;lose();return}
    flood(i);checkWin();render();
  }
  function toggleFlag(i){
    if(finished)return;
    const c=cells[i];if(c.open)return;
    if(!c.flag&&flags>=cfg.mines){toast('All flags are already placed');return}
    c.flag=!c.flag;flags+=c.flag?1:-1;moves++;movesEl.textContent=moves;mineCount.textContent=cfg.mines-flags;
    render();checkWin();
  }
  function chord(i){
    const c=cells[i];if(!c.open||!c.count||finished)return;
    const ns=neighbors(i),f=ns.filter(n=>cells[n].flag).length;
    if(f!==c.count)return;
    let hit=false;
    ns.forEach(n=>{
      const x=cells[n];
      if(!x.open&&!x.flag){if(x.mine){x.open=true;hit=true}else flood(n)}
    });
    moves++;movesEl.textContent=moves;
    hit?lose():(checkWin(),render());
  }
  function lose(){
    finished=true;stopTimer();cells.forEach(c=>{if(c.mine)c.open=true});
    if(navigator.vibrate)navigator.vibrate([80,50,120]);
    render();toast('Boom — new game?','lose');
  }
  function checkWin(){
    const safe=cfg.rows*cfg.cols-cfg.mines;
    if(cells.filter(c=>c.open&&!c.mine).length===safe){
      finished=true;stopTimer();cells.forEach(c=>{if(c.mine)c.flag=true});
      flags=cfg.mines;mineCount.textContent=0;render();
      if(navigator.vibrate)navigator.vibrate([30,40,30]);
      toast(`Cleared in ${seconds}s 🎉`,'win');
    }
  }
  function newGame(){
    stopTimer();cfg=levels[level];started=false;finished=false;flags=0;moves=0;seconds=0;
    mineCount.textContent=cfg.mines;time.textContent=0;movesEl.textContent=0;empty();render();
    requestAnimationFrame(()=>{autoCell();scroller.scrollTo(0,0)});
  }

  let down=null,moved=false;
  scroller.addEventListener('pointerdown',e=>{
    down={x:e.clientX,y:e.clientY};moved=false;
  },{passive:true});
  scroller.addEventListener('pointermove',e=>{
    if(down&&Math.hypot(e.clientX-down.x,e.clientY-down.y)>8)moved=true;
  },{passive:true});
  scroller.addEventListener('pointerup',()=>{down=null},{passive:true});

  board.addEventListener('click',e=>{
    const el=e.target.closest('.cell');if(!el||moved)return;
    const i=+el.dataset.i,c=cells[i];
    if(c.open&&mode==='shovel'){chord(i);return}
    mode==='flag'?toggleFlag(i):reveal(i);
  });
  board.addEventListener('contextmenu',e=>{
    const el=e.target.closest('.cell');if(!el)return;e.preventDefault();toggleFlag(+el.dataset.i);
  });

  shovel.onclick=()=>setMode('shovel'); flag.onclick=()=>setMode('flag'); $('newGame').onclick=newGame;
  document.querySelectorAll('[data-level]').forEach(b=>b.onclick=()=>{
    level=b.dataset.level;
    document.querySelectorAll('[data-level]').forEach(x=>x.classList.toggle('active',x===b));
    newGame();
  });
  $('zoomIn').onclick=()=>setCell((manualCell||cfg.cell)+3);
  $('zoomOut').onclick=()=>setCell((manualCell||cfg.cell)-3);
  $('fitBtn').onclick=fitWidth;

  window.addEventListener('beforeinstallprompt',e=>{
    e.preventDefault();deferredPrompt=e;$('installBtn').classList.add('show');
  });
  $('installBtn').onclick=async()=>{
    if(!deferredPrompt)return;deferredPrompt.prompt();await deferredPrompt.userChoice;deferredPrompt=null;
    $('installBtn').classList.remove('show');
  };
  if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js'));

  window.addEventListener('resize',()=>requestAnimationFrame(autoCell),{passive:true});
  newGame();
})();
</script>
</body>
</html>
